# Lefthook — 本地 Git 钩子配置
# 安装：cargo install lefthook --locked  （或 https://lefthook.dev/installation/）
# 启用：lefthook install   （在 .git/hooks 下写入转发脚本，团队成员 clone 后各执行一次）
# 手动触发：lefthook run pre-commit

pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: "*.rs"
      exclude:
        glob: "target/**"
      run: cargo fmt --all -- --check
      stage_fixed: false
    clippy:
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings
    gitleaks:
      # 扫描暂存区，阻止密钥/token 进入提交
      run: gitleaks protect --staged --no-banner
      fail_text: "暂存区中检测到疑似密钥，请移除后再提交。"

commit-msg:
  commands:
    conventional:
      # 校验 Conventional Commits：feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert[(scope)][!]: 描述
      # {1} 为存放提交信息的临时文件路径；豁免 Merge/Revert 自动生成的提交
      run: >
        sh -c 'head -1 {1} | grep -Eq "^Merge" || head -1 {1} | grep -Eq "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9._-]+\))?!?: .{1,}"'
      fail_text: "提交信息不符合 Conventional Commits 规范，例如：feat(tui): 添加事件循环"

pre-push:
  commands:
    test:
      run: cargo test --all-targets
